---
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify version manifests
        run: python3 scripts/sync_version.py --check

  idf-purity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: IDF purity gate (no Arduino-only APIs outside compat layer)
        run: bash scripts/check_idf_purity.sh

  native-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native unit tests
        working-directory: test/native
        run: pio test -e native -v --without-uploading

  idf-build:
    # Pure ESP-IDF compile of the core, once with runtime identity keys and once
    # without them (the provisioned-flash path).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        idf: ["v5.1.4", "v5.3.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build examples/basic with ESP-IDF ${{ matrix.idf }}
        uses: >-
          espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32
          path: examples/basic
          command: >-
            python -m pip install "idf-component-manager>=1.5.2,<2" &&
            idf.py build &&
            cp ../../examples/keys.h.template main/keys.h &&
            printf "\n#define USE_CA_CERT\n" >> main/keys.h &&
            idf.py build
