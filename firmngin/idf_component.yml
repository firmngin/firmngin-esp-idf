version: 1.4.0

## ESP-IDF component manifest for Firmngin (pure IDF builds).
## Arduino builds do not read this file; they use vendored esp_websocket_client
## via the Arduino core instead.
dependencies:
  idf: ">=5.1,<6.0"
  # Pin manifests understood by the component manager bundled with IDF 5.1.
  espressif/esp_websocket_client:
    version: "1.4.0"
    require: public
  joltwallet/littlefs: "1.10.2"
